MEMORY {
  ROML:  start = $8000, size = $2000, fill = yes, fillval = $FF, file = %O;
  ROMH:  start = $E000, size = $1FFA, fill = yes, fillval = $FF, file = %O;
  VEC:   start = $FFFA, size = 6, file = %O;
}
SEGMENTS {
  ROML:    load = ROML, type = ro;
  ROMH:    load = ROMH, type = ro;
  VECTORS: load = VEC, type = ro;
}
